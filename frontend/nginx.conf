server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: procura o container "backend" a cada chamada.
    # Assim o front sobe mesmo se o back ainda não estiver no ar (a API só devolve 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/... vai pro back. "backend" é o nome do serviço no deploy/docker-compose.yaml
    location /api/ {
        # fotos de produto: até 5 MB (o padrão do nginx é 1 MB)
        client_max_body_size 6m;
        set $back http://backend:8080;
        proxy_pass $back;
        # Host com a porta (localhost:4200): assim o Spring vê o pedido como da mesma origem e não barra no CORS
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O resto é o Angular: /admin/vendas e qualquer outra rota devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
