<section id="inicio" class="hero">
  <app-brasas />
  <div class="texto">
    <h1 revelar>Espeto na brasa</h1>
    <p class="descricao" revelar [atraso]="90">
      Espetaria artesanal em Bragança Paulista. Espetos feitos à mão, assados na brasa e servidos do jeito que
      Bragança gosta. Peça pelo WhatsApp ou venha nos visitar.
    </p>
    <div class="acoes" revelar [atraso]="180">
      <a class="btn btn-whatsapp" [href]="whatsapp" target="_blank" rel="noopener">
        <app-icone-whatsapp [size]="20" /> Pedir pelo WhatsApp
      </a>
      <a class="btn btn-contorno" [href]="instagram" target="_blank" rel="noopener">
        <lucide-icon [img]="icones.Instagram" [size]="20" /> Ver no Instagram
      </a>
    </div>
  </div>

  <div class="ilustracao" aria-hidden="true">
    <div class="quadro">
      <img class="grelha" src="grelha.png" alt="" width="480" height="480" />
      <app-espeto class="espeto de-cima" [pecas]="espetoDeCima" [quantidade]="5" [inclinacao]="-14" />
      <app-espeto class="espeto de-baixo" [pecas]="espetoDeBaixo" [quantidade]="5" [inclinacao]="-14" />
    </div>
  </div>
</section>
